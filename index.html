<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<link rel="manifest" href="manifest.json">
<title>IST ↔ UTC • Aviation</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--text:#111827;--muted:#64748b;--border:#d7dce3;--accent:#111827;--soft:#f3f4f6}
body.dark{--bg:#0b1220;--card:#121a2a;--text:#f8fafc;--muted:#a8b1c1;--border:#2a3548;--accent:#f8fafc;--soft:#1b2536}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:auto;padding:18px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 5px 20px #00000012;margin-bottom:14px}
.clock{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clockbox{background:var(--soft);border-radius:15px;padding:12px}.clockbox b{display:block;font-size:12px;color:var(--muted)}.clockbox span{font-size:22px;font-weight:800}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}select,input,button{width:100%;min-height:52px;border-radius:13px;font-size:17px}select,input{border:1px solid var(--border);background:var(--card);color:var(--text);padding:0 13px}
button{border:0;background:var(--accent);color:var(--card);font-weight:800;padding:0 14px;margin-top:10px}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.result{margin-top:16px;background:var(--soft);border-radius:15px;padding:16px;font-size:18px;font-weight:800;line-height:1.7;white-space:pre-line}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body>
<main>
<div class="top"><div><h1>✈️ IST ↔ UTC</h1><div class="sub">Aviation Time Converter • Zulu Time</div></div><button id="dark" class="secondary" style="width:auto;min-height:44px;margin:0">☾</button></div>

<div class="card">
<div class="clock">
<div class="clockbox"><b>INDIA • IST</b><span id="istNow">--:--:--</span></div>
<div class="clockbox"><b>UTC • ZULU</b><span id="utcNow">--:--:--Z</span></div>
</div>
</div>

<div class="card">
<label for="direction">Conversion</label>
<select id="direction"><option>IST → UTC / Z</option><option>UTC / Z → IST</option></select>
<label for="dt">Date & time</label>
<input id="dt" placeholder="DD-MM-YYYY HH:MM:SS" inputmode="numeric" autocomplete="off">
<button onclick="convert()">CONVERT</button>
<div class="row">
<button class="secondary" onclick="currentTime()">Current Time</button>
<button class="secondary" onclick="swap()">↔ Swap</button>
</div>
<div id="result" class="result">Result will appear here</div>
<div class="row">
<button class="secondary" onclick="copyResult()">Copy Result</button>
<button class="secondary" onclick="clearAll()">Clear</button>
</div>
<div class="tiny">IST = UTC + 05:30 • Date rollover handled automatically</div>
</div>
</main>
<script>
const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return `${pad(d.getUTCDate())}-${pad(d.getUTCMonth()+1)}-${d.getUTCFullYear()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`}
function parse(s){let m=s.match(/^(\\d{2})-(\\d{2})-(\\d{4})\\s+(\\d{2}):(\\d{2})(?::(\\d{2}))?$/);if(!m)throw 0;let[_,d,mo,y,h,mi,se='00']=m;let x=new Date(Date.UTC(+y,+mo-1,+d,+h,+mi,+se));if(x.getUTCFullYear()!=+y||x.getUTCMonth()!=+mo-1||x.getUTCDate()!=+d||+h>23||+mi>59||+se>59)throw 0;return x}
function convert(){try{let d=parse($('dt').value.trim()),off=330*60000,out=$('direction').selectedIndex===0?new Date(d-off):new Date(d.getTime()+off),utc=$('direction').selectedIndex===0?fmt(out):fmt(d),ist=$('direction').selectedIndex===0?fmt(d):fmt(out);$('result').textContent=`IST: ${ist}\\n\\nUTC / Z: ${utc}Z`;}catch(e){$('result').textContent='❌ Invalid format.\\nUse: DD-MM-YYYY HH:MM:SS'}}
function currentTime(){let n=new Date(),ist=new Date(n.getTime()+330*60000);$('dt').value=fmt(ist)}
function swap(){$('direction').selectedIndex=$('direction').selectedIndex?0:1;if($('dt').value)convert()}
function clearAll(){$('dt').value='';$('result').textContent='Result will appear here'}
function copyResult(){navigator.clipboard?.writeText($('result').textContent)}
function clocks(){let n=new Date(),ist=new Date(n.getTime()+330*60000);$('istNow').textContent=`${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())}`;$('utcNow').textContent=`${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}Z`}
setInterval(clocks,1000);clocks();
$('dark').onclick=()=>{document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?'1':'0'};if(localStorage.dark==='1')document.body.classList.add('dark');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body></html>
