<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><link rel="manifest" href="manifest.json">
<title>IST ↔ UTC • Aviation</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--text:#111827;--muted:#64748b;--border:#d7dce3;--accent:#111827;--soft:#f3f4f6}
body.dark{--bg:#0b1220;--card:#121a2a;--text:#f8fafc;--muted:#a8b1c1;--border:#2a3548;--accent:#f8fafc;--soft:#1b2536}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:auto;padding:18px 16px 34px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:24px;margin:0}.sub{color:var(--muted);font-size:13px;margin:3px 0 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px;box-shadow:0 5px 20px #0001;margin-bottom:14px}
.clock{display:grid;grid-template-columns:1fr 1fr;gap:10px}.clockbox{background:var(--soft);border-radius:15px;padding:12px}.clockbox b{display:block;font-size:12px;color:var(--muted)}.clockbox span{font-size:21px;font-weight:800}
label{display:block;font-size:13px;font-weight:800;margin:14px 0 7px}
select,input,button{width:100%;min-height:52px;border-radius:13px;font-size:17px}select,input{border:1px solid var(--border);background:var(--card);color:var(--text);padding:0 13px}
button{border:0;background:var(--accent);color:var(--card);font-weight:800;padding:0 14px;margin-top:10px}.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.result{margin-top:16px;background:var(--soft);border-radius:15px;padding:16px;font-size:18px;font-weight:800;line-height:1.7;white-space:pre-line}
.tiny{font-size:12px;color:var(--muted);text-align:center;margin-top:12px}
</style>
</head>
<body><main>
<div class="top"><div><h1>✈️ IST ↔ UTC</h1><div class="sub">Aviation Time Converter • Zulu Time</div></div><button id="dark" class="secondary" style="width:auto;min-height:44px;margin:0">☾</button></div>
<div class="card"><div class="clock"><div class="clockbox"><b>INDIA • IST</b><span id="istNow">--:--:--</span></div><div class="clockbox"><b>UTC • ZULU</b><span id="utcNow">--:--:--Z</span></div></div></div>
<div class="card">
<label for="direction">Conversion</label><select id="direction"><option>IST → UTC / Z</option><option>UTC / Z → IST</option></select>
<label for="date">Date</label><input id="date" type="date">
<label for="time">Time (24-hour)</label><input id="time" type="time" step="1">
<button onclick="convert()">CONVERT</button>
<div class="row"><button class="secondary" onclick="currentTime()">Current Time</button><button class="secondary" onclick="swap()">↔ Swap</button></div>
<div id="result" class="result">Select a date and time</div>
<div class="row"><button class="secondary" onclick="copyResult()">Copy Result</button><button class="secondary" onclick="clearAll()">Clear</button></div>
<div class="tiny">IST = UTC + 05:30 • Date rollover handled automatically</div>
</div></main>
<script>
const $=id=>document.getElementById(id),off=330*60000;
const pad=n=>String(n).padStart(2,'0');
function makeUTC(){let [y,m,d]=$('date').value.split('-').map(Number),[h,mi,se]=$('time').value.split(':').map(Number);return new Date(Date.UTC(y,m-1,d,h,mi,se||0))}
function fmt(d,z=false){return `${pad(d.getUTCDate())}-${pad(d.getUTCMonth()+1)}-${d.getUTCFullYear()} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}${z?'Z':''}`}
function setFields(d){$('date').value=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;$('time').value=`${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}:${pad(d.getUTCSeconds())}`}
function convert(){if(!$('date').value||!$('time').value){$('result').textContent='❌ Select both date and time.';return}let entered=makeUTC(),out=$('direction').selectedIndex===0?new Date(entered-off):new Date(entered.getTime()+off);if($('direction').selectedIndex===0)$('result').textContent=`IST: ${fmt(entered)}\n\nUTC / Z: ${fmt(out,true)}`;else $('result').textContent=`UTC / Z: ${fmt(entered,true)}\n\nIST: ${fmt(out)}`}
function currentTime(){let n=new Date(),ist=new Date(n.getTime()+off);setFields(ist)}
function swap(){$('direction').selectedIndex=$('direction').selectedIndex?0:1;if($('date').value&&$('time').value)convert()}
function clearAll(){$('date').value='';$('time').value='';$('result').textContent='Select a date and time'}
function copyResult(){navigator.clipboard?.writeText($('result').textContent)}
function clocks(){let n=new Date(),ist=new Date(n.getTime()+off);$('istNow').textContent=`${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())}`;$('utcNow').textContent=`${pad(n.getUTCHours())}:${pad(n.getUTCMinutes())}:${pad(n.getUTCSeconds())}Z`}
setInterval(clocks,1000);clocks();
$('dark').onclick=()=>{document.body.classList.toggle('dark');localStorage.dark=document.body.classList.contains('dark')?'1':'0'};if(localStorage.dark==='1')document.body.classList.add('dark');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
